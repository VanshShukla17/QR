services:
  # Staging Backend API
  - type: web
    name: qraksha-api-staging
    runtime: node
    plan: starter
    region: oregon
    branch: staging
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://qraksha-v3ru.netlify.app,https://staging.qraksha.vercel.app,http://localhost:3000,http://localhost:3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAIN_RPC_URL
        value: https://polygon-amoy.drpc.org
      - key: CHAIN_PRIVATE_KEY
        sync: false
      - key: CHAIN_NETWORK
        value: amoy
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging

  # Production (Pilot) Backend API - Manual approval gated per ARCHITECTURE.md Section 13
  - type: web
    name: qraksha-api-prod
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://qraksha-v3ru.netlify.app,https://qraksha.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAIN_RPC_URL
        value: https://polygon-amoy.drpc.org
      - key: CHAIN_PRIVATE_KEY
        sync: false
      - key: CHAIN_NETWORK
        value: amoy
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
